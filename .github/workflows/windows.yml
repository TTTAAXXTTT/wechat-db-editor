name: Windows tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Scan publication candidates
        run: python tools/check_publication.py
      - name: Synthetic database and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Source runtime self-test
        run: python direct_app.py --self-test
      - name: Build direct editor and test executable
        run: python tools/build.py
      - name: Build copy editor and test executable
        run: python tools/build.py --mode copy
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: wechat-db-editor-windows-x64
          path: dist/*.exe
          if-no-files-found: error
